# Blueprint de Render: publica la Torre de Control (API + interfaz) con HTTPS, necesario
# para que el GPS funcione en los teléfonos, y una base PostgreSQL gratuita donde quedan
# guardados camiones, bodega, productos, obras y pedidos.
# En Render: New → Blueprint → este repositorio → Apply (o el botón «Activar guardado en la
# nube» de la app). El nombre del servicio define su dirección, que la app en GitHub Pages
# busca sola: https://torre-control-constructor-center.onrender.com. La clave de acceso la
# crea quien abre la app por primera vez.
databases:
  - name: torre-control-db
    plan: free
    databaseName: torre_control
    user: torre

services:
  - type: web
    name: torre-control-constructor-center
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: torre-control-db
          property: connectionString
