# Verifica la Torre de Control en cada push y publica la app en GitHub Pages (rama
# gh-pages) para abrirla desde cualquier dispositivo con el enlace:
#   https://clapsdmccontacto-gif.github.io/TORRE-DE-CONTROL-/
# También deja torre-control.html (la app en un solo archivo) en Actions → Artifacts.
name: Torre de Control

on:
  push:
    branches-ignore: [gh-pages]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: torre-control-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm run setup
      - name: Typecheck, lint, tests y build
        run: npm run check
      - name: App en un solo archivo HTML
        run: node frontend/scripts/inline-html.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: torre-control-html
          path: frontend/dist/torre-control.html
      - if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-artifact@v4
        with:
          name: sitio
          path: frontend/dist

  # Publica la interfaz (modo local: funciona sin servidor) en la rama gh-pages.
  publish:
    needs: check
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sitio
          path: sitio
      - name: Publicar en la rama gh-pages
        working-directory: sitio
        env:
          TOKEN: ${{ github.token }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Publicar ${GITHUB_SHA::7}"
          git push -f -q "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
